<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff sign in | Nest &amp; Nook</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400&display=swap');

body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#fbfaf7;color:#172e46;font:16px 'DM Sans',Arial,sans-serif}
